[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomm-prod-assistant"
version = "0.1.0"
description = "An LLM-powered e-commerce product assistant using RAG and MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.13.5",
    "fastapi==0.116.1",
    "html5lib==1.1",
    "jinja2==3.1.6",
    "langchain==0.3.27",
    "langchain-astradb==0.6.1",
    "langchain-core==0.3.75",
    "langchain-google-genai==2.1.8",
    "langchain-groq==0.3.6",
    "lxml==6.0.1",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "selenium==4.35.0",
    "streamlit==1.49.1",
    "undetected-chromedriver==3.5.5",
    "uvicorn==0.35.0",
    "structlog==25.4.0",
    "langgraph==0.6.7",
    "ragas==0.3.4",
    "langchain-mcp-adapters==0.1.10",
    "mcp==1.14.0",
    "ddgs==9.6.0",
    "langchain-openai==0.3.32",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["prod_assistant"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.12",
]
