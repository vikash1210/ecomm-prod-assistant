
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomm-prod-assistant"
version = "0.1.0"
description = "An LLM-powered e-commerce product assistant using RAG and MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["prod_assistant"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.12",
]
